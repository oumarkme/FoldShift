[package]
name = "psplot_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Variants to protein sequences; AlphaFold result comparison (alignment, superposition, distances)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Windows and macOS use the operating system's TLS; Linux (development only) uses rustls.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
