# On a version tag (v*): build the three programs and the server image in parallel, then publish the release.
# Format, lint, and tests are run before tagging, not here.
name: release
on: {push: {tags: ["v*"]}}
permissions: {contents: write, packages: write}
jobs:
  build:
    strategy:
      matrix:
        include:
          - {os: windows-latest, target: x86_64-pc-windows-msvc, name: windows_x64, ext: .exe}
          - {os: windows-11-arm, target: aarch64-pc-windows-msvc, name: windows_arm64, ext: .exe}
          - {os: macos-latest, target: aarch64-apple-darwin, name: macos_arm64, ext: ""}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p psplot
        env: {RUSTFLAGS: "${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}"}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/FoldShift${{ matrix.ext }}
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: "${{ steps.meta.outputs.tags }}", labels: "${{ steps.meta.outputs.labels }}"}
        env: {DOCKER_BUILD_RECORD_UPLOAD: "false"}
  release:
    needs: [build, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts, pattern: "*_*64"}
      - name: Name the files with the version and publish
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir out
          for n in windows_x64 windows_arm64; do cp artifacts/$n/FoldShift.exe out/FoldShift_${GITHUB_REF_NAME}_$n.exe; done
          cp artifacts/macos_arm64/FoldShift out/FoldShift_${GITHUB_REF_NAME}_macos_arm64
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "FoldShift $GITHUB_REF_NAME" --generate-notes
